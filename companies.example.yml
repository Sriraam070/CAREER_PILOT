# Target companies, imported from your Notion "Job Tracker" (47 companies).
# `careerpilot notion-pull` refreshes names/tiers from Notion; ATS settings here are kept.
#
# ats: workday | smartrecruiters | greenhouse | lever | ashby | amazon | adzuna | manual
#  - workday/smartrecruiters/greenhouse/lever/ashby/amazon read the company's own public careers API.
#  - adzuna searches the Adzuna job API by company name (free key) for companies without one.
#  - manual: no automatic discovery; add jobs from the UI / `careerpilot add-job`.
# aliases: other spellings used in job postings (matched case/space-insensitively, by prefix).
# verified: false = best-known mapping, not yet tested. Run `careerpilot doctor` to test each one.
# Find a company's ATS: open any job on its careers site and look at the URL
#   (myworkdayjobs.com / boards.greenhouse.io / jobs.lever.co / smartrecruiters.com / ashbyhq.com).
companies:
- name: AUTO DESK
  tiers:
  - MARQUEE
  careers_url: ''
  ats: workday
  params:
    host: autodesk.wd1.myworkdayjobs.com
    tenant: autodesk
    site: Ext
  verified: false
  aliases:
  - Autodesk
